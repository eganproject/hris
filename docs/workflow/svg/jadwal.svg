ukar jadwal yang sudah</text><text x="448.88" y="300.35" font-family="DejaVu Sans" font-size="7.50" fill="#065f46" text-anchor="middle">disetujui</text><path d="M 61.10 320.00 L 61.10 329.00" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M 190.40 320.00 L 190.40 329.00" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M 319.60 320.00 L 319.60 329.00" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M 448.90 320.00 L 448.90 329.00" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M 61.10 329.00 L 448.90 329.00" fill="none" stroke="#94a3b8" stroke-width="1"/><line x1="255.00" y1="329.00" x2="255.00" y2="334.50" stroke="#94a3b8" stroke-width="1"/><polygon points="255.00,338.00 252.06,333.80 257.94,333.80" fill="#94a3b8"/><polygon points="99.00,338.00 420.00,338.00 411.00,378.00 90.00,378.00" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="255.00" y="360.89" font-family="DejaVu Sans" font-size="8.50" fill="#1e293b" text-anchor="middle">employee_schedules — untuk tiap tanggal: shift, libur, atau WFH</text><line x1="255.00" y1="378.00" x2="255.00" y2="392.50" stroke="#94a3b8" stroke-width="1"/><polygon points="255.00,396.00 252.06,391.80 257.94,391.80" fill="#94a3b8"/><rect x="105.00" y="396.00" width="300.00" height="42.00" rx="5.00" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/><text x="255.00" y="414.75" font-family="DejaVu Sans" font-size="7.50" fill="#065f46" text-anchor="middle">Setiap perubahan roster memicu penghitungan ulang absensi yang</text><text x="255.00" y="424.35" font-family="DejaVu Sans" font-size="7.50" fill="#065f46" text-anchor="middle">sudah tercatat pada rentang itu</text><line x1="255.00" y1="438.00" x2="255.00" y2="456.50" stroke="#94a3b8" stroke-width="1"/><polygon points="255.00,460.00 252.06,455.80 257.94,455.80" fill="#94a3b8"/><rect x="60.00" y="460.00" width="180.00" height="38.00" rx="5.00" fill="#eff6ff" stroke="#60a5fa" stroke-width="1"/><text x="150.00" y="481.72" font-family="DejaVu Sans" fo
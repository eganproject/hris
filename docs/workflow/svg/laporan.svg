iddle">Unduh PDF</text><path d="M 85.00 328.00 L 85.00 342.00 L 425.00 342.00 L 425.00 328.00" fill="none" stroke="#94a3b8" stroke-width="1"/><line x1="255.00" y1="342.00" x2="255.00" y2="352.50" stroke="#94a3b8" stroke-width="1"/><polygon points="255.00,356.00 252.06,351.80 257.94,351.80" fill="#94a3b8"/><rect x="105.00" y="356.00" width="300.00" height="30.00" rx="5.00" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="255.00" y="373.72" font-family="DejaVu Sans" font-size="8.00" fill="#334155" text-anchor="middle">Detail per karyawan · bahan penggajian · arsip bulanan</text><rect x="0.00" y="400.00" width="250.00" height="53.00" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/><rect x="0.00" y="400.00" width="3" height="53.00" fill="#fcd34d"/><text x="11.00" y="413.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">Angka “hadir” memakai satu definisi bersama: Hadir,</text><text x="11.00" y="423.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">Terlambat, Pulang Cepat, WFH, dan Dinas Luar</text><text x="11.00" y="434.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">semuanya terhitung bekerja — sehingga rekap, papan</text><text x="11.00" y="444.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">harian, dan ekspor tidak pernah berbeda.</text><rect x="260.00" y="400.00" width="250.00" height="53.00" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/><rect x="260.00" y="400.00" width="3" height="53.00" fill="#fcd34d"/><text x="271.00" y="413.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">Kolom “total hari” hanya menghitung hari kerja</text><text x="271.00" y="423.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">terjadwal; libur nasional dan libur jadwal tidak ikut, agar</text><text x="271.00" y="434.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">rincian hadir + alfa + cuti + sakit berdamai dengan</text><text x="271.00" y="444.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">totalnya.</text><rect x="0.00" y="470.00" width="510.00" height="30.60" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/><rect x="0.00" y="470.00" width="3" height="30.60" fill="#fcd34d"/><text x="11.00" y="483.00" font-family="DejaVu Sans" font-size="7.00" fill="#78350f" text-anchor="start">Hak akses melihat dan mengekspor tiap laporan diatur terpisah, jadi seseorang bisa diberi hak membaca rekap tanpa diberi hak</text><text x="11.00" y="492.80" font-family="DejaVu Sans" font-size="7.00" fill="#78350f" text-anchor="start">mengunduhnya.</text></svg>
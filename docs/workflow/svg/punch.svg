.00" y1="110.00" x2="260.00" y2="120.50" stroke="#94a3b8" stroke-width="1"/><polygon points="260.00,124.00 257.06,119.80 262.94,119.80" fill="#94a3b8"/><rect x="165.00" y="124.00" width="190.00" height="48.00" rx="5.00" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/><text x="260.00" y="140.95" font-family="DejaVu Sans" font-size="7.50" fill="#065f46" text-anchor="middle">Serial mesin diperiksa terhadap daftar</text><text x="260.00" y="150.55" font-family="DejaVu Sans" font-size="7.50" fill="#065f46" text-anchor="middle">yang diizinkan; punch kembar disaring</text><text x="260.00" y="160.15" font-family="DejaVu Sans" font-size="7.50" fill="#065f46" text-anchor="middle">lewat sidik unik</text><line x1="260.00" y1="172.00" x2="260.00" y2="182.50" stroke="#94a3b8" stroke-width="1"/><polygon points="260.00,186.00 257.06,181.80 262.94,181.80" fill="#94a3b8"/><polygon points="260.00,186.00 355.00,214.00 260.00,242.00 165.00,214.00" fill="#fefce8" stroke="#eab308" stroke-width="1"/><text x="260.00" y="211.45" font-family="DejaVu Sans" font-size="8.50" fill="#713f12" text-anchor="middle">PIN mesin sudah</text><text x="260.00" y="222.33" font-family="DejaVu Sans" font-size="8.50" fill="#713f12" text-anchor="middle">terpetakan ke karyawan?</text><path d="M 165.00 214.00 L 75.00 214.00 L 75.00 238.00" fill="none" stroke="#94a3b8" stroke-width="1"/><polygon points="75.00,238.00 72.06,233.80 77.94,233.80" fill="#94a3b8"/><rect x="107.81" y="203.62" width="24.37" height="8.85" fill="#ffffff"/><text x="120.00" y="210.00" font-family="DejaVu Sans" font-size="7.50" fill="#475569" text-anchor="middle">Tidak</text><rect x="0.00" y="238.00" width="150.00" height="44.00" rx="5.00" fill="#fee2e2" stroke="#f87171" stroke-width="1"/><text x="75.00" y="257.75" font-family="DejaVu Sans" font-size="7.50" fill="#7f1d1d" text-anchor="middle">Punch masuk daftar Belum</text><text x="75.00" y="267.35" font-family="DejaVu Sans" font-size="7.50" fill="#7f1d1d" text-anchor="middle">Terpetakan di menu Data Punch</text><line x1="75.00" y1="282.00" x2="75.00" y2="290.50" stroke="#94a3b8" stroke-width="1"/><polygon points="75.00,294.00 72.06,289.80 77.94,289.80" fill="#94a3b8"/><rect x="0.00" y="294.00" width="150.00" height="52.00" rx="5.00" fill="#fff7ed" stroke="#fb923c" stroke-width="1"/><text x="75.00" y="312.95" font-family="DejaVu Sans" font-size="7.50" fill="#7c2d12" text-anchor="middle">HR memetakan PIN ke karyawan</text><text x="75.00" y="322.55" font-family="DejaVu Sans" font-size="7.50" fill="#7c2d12" text-anchor="middle">— punch lama dengan PIN itu</text><text x="75.00" y="332.15" font-family="DejaVu Sans" font-size="7.50" fill="#7c2d12" text-anchor="middle">ikut ditarik ulang</text><path d="M 150.00 320.00 L 245.00 320.00 L 245.00 360.00" fill="none" stroke="#94a3b8" stroke-width="1"/><polygon points="245.00,360.00 242.06,355.80 247.94,355.80" fill="#94a3b8"/><line x1="260.00" y1="242.00" x2="260.00" y2="356.50" stroke="#94a3b8" stroke-width="1"/><polygon points="260.00,360.00 257.06,355.80 262.94,355.80" fill="#94a3b8"/><rect x="262.00" y="297.62" width="13.18" height="8.85" fill="#ffffff"/><text x="264.00" y="304.00" font-family="DejaVu Sans" font-size="7.50" fill="#475569" text-anchor="start">Ya</text><rect x="165.00" y="360.00" width="190.00" height="56.00" rx="5.00" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/><text x="260.00" y="385.75" font-family="DejaVu Sans" font-size="7.50" fill="#065f46" text-anchor="middle">Punch pertama dan terakhir dalam jendela</text><text x="260.00" y="395.35" font-family="DejaVu Sans" font-size="7.50" fill="#065f46" text-anchor="middle">shift menjadi jam masuk dan jam pulang</text><line x1="260.00" y1="416.00" x2="260.00" y2="428.50" stroke="#94a3b8" stroke-width="1"/><polygon points="260.00,432.00 257.06,427.80 262.94,427.80" fill="#94a3b8"/><rect x="150.00" y="432.00" width="220.00" height="26.00" rx="13.00" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="260.00" y="447.72" font-family="DejaVu Sans" font-size="8.00" fill="#14532d" text-anchor="middle">Lanjut ke penghitungan status →</text><rect x="370.00" y="22.00" width="140.00" height="84.50" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/><rect x="370.00" y="22.00" width="3" height="84.50" fill="#fcd34d"/><text x="381.00" y="35.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">Jendela kepemilikan punch:</text><text x="381.00" y="45.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">3 jam sebelum shift mulai</text><text x="381.00" y="56.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">sampai 10 jam sesudah shift</text><text x="381.00" y="66.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">selesai, dan selalu dipotong</text><text x="381.00" y="77.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">sebelum shift berikutnya —</text><text x="381.00" y="87.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">satu punch hanya dimiliki</text><text x="381.00" y="98.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">oleh satu hari kerja.</text><rect x="370.00" y="150.00" width="140.00" height="63.50" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/><rect x="370.00" y="150.00" width="3" height="63.50" fill="#fcd34d"/><text x="381.00" y="163.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">Karena kiriman kembar</text><text x="381.00" y="173.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">disaring, mesin boleh</text><text x="381.00" y="184.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">mengirim ulang data yang</text><text x="381.00" y="194.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">sama tanpa menggandakan</text><text x="381.00" y="205.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">absensi.</text><rect x="370.00" y="248.00" width="140.00" height="53.00" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/><rect x="370.00" y="248.00" width="3" height="53.00" fill="#fcd34d"/><text x="381.00" y="261.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">Shift malam tetap benar:</text><text x="381.00" y="271.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">punch pulang setelah</text><text x="381.00" y="282.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">tengah malam masih</text><text x="381.00" y="292.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">dimiliki hari sebelumnya.</text></svg>
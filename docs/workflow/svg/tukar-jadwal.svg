t-anchor="middle">Hasilnya ditulis sebagai override</text><text x="418.00" y="365.35" font-family="DejaVu Sans" font-size="7.50" fill="#065f46" text-anchor="middle">manual pada roster kedua karyawan</text><line x1="418.00" y1="380.00" x2="418.00" y2="392.50" stroke="#94a3b8" stroke-width="1"/><polygon points="418.00,396.00 415.06,391.80 420.94,391.80" fill="#94a3b8"/><rect x="330.00" y="396.00" width="176.00" height="26.00" rx="5.00" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="418.00" y="411.55" font-family="DejaVu Sans" font-size="7.50" fill="#14532d" text-anchor="middle">Absensi hari itu dihitung ulang</text><rect x="3.00" y="276.00" width="310.00" height="42.50" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/><rect x="3.00" y="276.00" width="3" height="42.50" fill="#fcd34d"/><text x="14.00" y="289.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">Bentrok diperiksa dua kali — saat diajukan dan sekali lagi saat HR</text><text x="14.00" y="299.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">memutuskan — karena roster bisa berubah di antaranya. Pengaju</text><text x="14.00" y="310.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">dapat membatalkan selama belum ada keputusan HR.</text><rect x="3.00" y="344.00" width="310.00" height="42.50" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/><rect x="3.00" y="344.00" width="3" height="42.50" fill="#fcd34d"/><text x="14.00" y="357.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">Tiga bentuk pengajuan: tukar shift dengan rekan, minta digantikan,</text><text x="14.00" y="367.50" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">dan tukar hari libur. Semuanya berakhir sebagai override manual</text><text x="14.00" y="378.00" font-family="DejaVu Sans" font-size="7.50" fill="#78350f" text-anchor="start">sehingga tidak akan tertimpa generator